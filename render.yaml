# Render Blueprint — deploy keralam.eat as a free static site.
# After pushing this repo, in the Render dashboard: New → Blueprint → select this repo.
services:
  - type: web
    name: keralam-eat
    runtime: static
    buildCommand: echo "static — nothing to build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: public, max-age=0, s-maxage=60
